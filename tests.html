<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectAssist Test Runner</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #eee; padding: 20px; line-height: 1.5; }
    h1 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; padding: 15px; background: #1e1e1e; border-radius: 8px; }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat-val { font-size: 24px; font-weight: bold; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .suite { margin-bottom: 20px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
    .suite-header { padding: 10px 15px; background: #2d2d2d; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
    .suite-results { padding: 15px; display: none; }
    .suite.open .suite-results { display: block; }
    .test { margin-bottom: 5px; display: flex; align-items: flex-start; gap: 10px; }
    .test-icon { font-weight: bold; flex-shrink: 0; }
    .test-name { flex-grow: 1; }
    .test-error { color: #f87171; font-family: monospace; font-size: 12px; margin-top: 5px; white-space: pre-wrap; display: block; }
    #app-container { display: none; } /* Hidden container for DOM tests */
  </style>
</head>
<body>
  <h1>ElectAssist Test Suite (150+ Assertions)</h1>
  
  <div class="stats">
    <div class="stat"><span class="stat-val" id="total-tests">0</span><span>Total</span></div>
    <div class="stat pass"><span class="stat-val" id="passed-tests">0</span><span>Passed</span></div>
    <div class="stat fail"><span class="stat-val" id="failed-tests">0</span><span>Failed</span></div>
    <div class="stat"><span class="stat-val" id="duration">0ms</span><span>Duration</span></div>
  </div>

  <div id="results">Running tests...</div>

  <div id="app-container"></div>

  <script type="module">
    import { runAllTests } from './tests.js';
    
    // Setup minimal DOM for tests that need it
    document.getElementById('app-container').innerHTML = `
      <div id="timeline-container"></div>
      <div id="faq-container"></div>
      <div id="booth-results"></div>
      <div id="map-container"></div>
    `;

    async function init() {
      const start = performance.now();
      const results = await runAllTests();
      const duration = performance.now() - start;
      
      document.getElementById('total-tests').textContent = results.total;
      document.getElementById('passed-tests').textContent = results.passed;
      document.getElementById('failed-tests').textContent = results.failed;
      document.getElementById('duration').textContent = duration.toFixed(0) + 'ms';
      
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      for (const [suiteName, suite] of Object.entries(results.suites)) {
        const suiteDiv = document.createElement('div');
        suiteDiv.className = 'suite open';
        
        const isAllPass = suite.failed === 0;
        
        suiteDiv.innerHTML = `
          <div class="suite-header" onclick="this.parentElement.classList.toggle('open')">
            <span>${suiteName}</span>
            <span class="${isAllPass ? 'pass' : 'fail'}">${suite.passed}/${suite.total} Passed</span>
          </div>
          <div class="suite-results">
            ${suite.tests.map(t => `
              <div class="test">
                <span class="test-icon ${t.passed ? 'pass' : 'fail'}">${t.passed ? '✓' : '✗'}</span>
                <div class="test-name">
                  ${t.name}
                  ${!t.passed && t.error ? `<span class="test-error">${t.error}</span>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
        resultsDiv.appendChild(suiteDiv);
      }
    }
    
    init();
  </script>
</body>
</html>
